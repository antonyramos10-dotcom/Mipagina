<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Feliz cumpleaños</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Karla:wght@400&display=swap" rel="stylesheet">

<style>
  :root {
    --noche:      #121A2E;
    --noche-alta: #1C2645;
    --llama:      #FFB03A;
    --nucleo:     #FFF2CB;
    --cera:       #E8DECB;
    --texto:      #EDE7DC;
    --tenue:      #8D97B8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--noche);
    color: var(--texto);
    font-family: "Fraunces", Georgia, serif;
    display: grid;
    place-items: center;
    min-height: 100dvh;
    padding: 2rem 1.5rem;
    overflow: hidden;
    transition: background 2.4s ease;
  }

  body.apagada { background: var(--noche-alta); }

  /* El resplandor de la vela sobre todo el fondo */
  .halo {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 42%,
      rgba(255, 176, 58, 0.22) 0%,
      rgba(255, 176, 58, 0.07) 28%,
      transparent 62%);
    animation: latir 4.5s ease-in-out infinite;
    pointer-events: none;
    transition: opacity 1.8s ease;
  }

  body.apagada .halo { opacity: 0; animation: none; }

  @keyframes latir {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.72; }
  }

  main {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    max-width: 30rem;
  }

  /* ---------- Escena 1: la vela ---------- */

  .escena {
    display: grid;
    justify-items: center;
    gap: 3rem;
    transition: opacity 1.2s ease;
  }

  body.apagada .escena { opacity: 0; pointer-events: none; }

  .vela {
    background: none;
    border: 0;
    padding: 1rem;
    cursor: pointer;
    border-radius: 999px;
  }

  .vela:focus-visible {
    outline: 2px solid var(--llama);
    outline-offset: 6px;
  }

  .llama {
    transform-origin: 50% 100%;
    animation: titilar 2.8s ease-in-out infinite;
  }

  body.apagada .llama {
    animation: extinguir 0.55s cubic-bezier(.4, 0, .9, .4) forwards;
  }

  @keyframes titilar {
    0%, 100% { transform: scale(1)          skewX(0deg); }
    25%      { transform: scale(1.04, 0.97) skewX(2.5deg); }
    50%      { transform: scale(0.96, 1.05) skewX(-1.5deg); }
    75%      { transform: scale(1.02, 0.99) skewX(1deg); }
  }

  @keyframes extinguir {
    to { transform: scale(0.15, 0.05); opacity: 0; }
  }

  .humo {
    opacity: 0;
    transform-origin: 50% 100%;
  }

  body.apagada .humo {
    animation: subir 2.6s ease-out 0.35s forwards;
  }

  body.apagada .humo:nth-of-type(2) { animation-delay: 0.6s; }
  body.apagada .humo:nth-of-type(3) { animation-delay: 0.9s; }

  @keyframes subir {
    0%   { opacity: 0;    transform: translateY(0)     translateX(0)    scale(0.6); }
    22%  { opacity: 0.45; }
    100% { opacity: 0;    transform: translateY(-90px) translateX(16px) scale(2.1); }
  }

  .pista {
    font-family: "Karla", system-ui, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
    color: var(--tenue);
  }

  /* ---------- Escena 2: el mensaje ---------- */

  .mensaje {
    position: absolute;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    text-align: center;
    gap: 1.6rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease 0.4s;
  }

  body.apagada .mensaje { opacity: 1; pointer-events: auto; }

  .mensaje h1 {
    font-size: clamp(2.6rem, 13vw, 4.1rem);
    font-weight: 600;
    font-variation-settings: "opsz" 144;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .mensaje p {
    font-weight: 300;
    font-size: 1.16rem;
    line-height: 1.65;
    max-width: 22rem;
    text-wrap: pretty;
  }

  .firma {
    font-family: "Karla", system-ui, sans-serif;
    font-size: 0.9rem;
    color: var(--tenue);
    margin-top: 0.4rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .halo, .llama { animation: none; }
    body, .halo, .escena, .mensaje { transition-duration: 0.3s; }
    body.apagada .llama { animation: none; opacity: 0; }
    body.apagada .humo  { animation: none; }
  }
</style>
</head>
<body>

<div class="halo"></div>

<main>

  <div class="escena">
    <button class="vela" id="vela" aria-label="Apagar la vela y ver el mensaje">
      <svg width="132" height="200" viewBox="0 0 132 200" aria-hidden="true">
        <defs>
          <radialGradient id="gLlama" cx="50%" cy="68%" r="58%">
            <stop offset="0%"   stop-color="var(--nucleo)"/>
            <stop offset="45%"  stop-color="var(--llama)"/>
            <stop offset="100%" stop-color="var(--llama)" stop-opacity="0.15"/>
          </radialGradient>
          <linearGradient id="gCera" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#B8AC94"/>
            <stop offset="38%"  stop-color="var(--cera)"/>
            <stop offset="100%" stop-color="#9C9078"/>
          </linearGradient>
          <filter id="difuso"><feGaussianBlur stdDeviation="3.2"/></filter>
        </defs>

        <!-- humo, solo visible al apagar -->
        <g fill="var(--tenue)" filter="url(#difuso)">
          <ellipse class="humo" cx="66" cy="66" rx="5" ry="7"/>
          <ellipse class="humo" cx="63" cy="66" rx="4" ry="6"/>
          <ellipse class="humo" cx="69" cy="66" rx="3.5" ry="5.5"/>
        </g>

        <!-- llama -->
        <g class="llama">
          <path d="M66 22 C 82 44, 88 56, 88 68 C 88 84, 78 94, 66 94
                   C 54 94, 44 84, 44 68 C 44 56, 50 44, 66 22 Z"
                fill="url(#gLlama)"/>
          <path d="M66 52 C 73 64, 75 70, 75 75 C 75 83, 71 88, 66 88
                   C 61 88, 57 83, 57 75 C 57 70, 59 64, 66 52 Z"
                fill="var(--nucleo)" opacity="0.92"/>
        </g>

        <!-- pabilo y cuerpo -->
        <path d="M66 94 L66 104" stroke="#3A3226" stroke-width="3" stroke-linecap="round"/>
        <rect x="46" y="102" width="40" height="92" rx="4" fill="url(#gCera)"/>
        <ellipse cx="66" cy="102" rx="20" ry="5.5" fill="#F2EADA"/>
      </svg>
    </button>

    <p class="pista">Pide un deseo y toca la llama</p>
  </div>

  <!-- ============================================================
       EDITA ESTAS LÍNEAS: es lo único que se ve en la escena final
       ============================================================ -->
  <div class="mensaje">
    <h1>Feliz cumpleaños</h1>
    <p>Que este año te traiga todo eso que andás buscando, y un poco más de lo que no sabías que querías.</p>
    <p class="firma">Con cariño</p>
  </div>

</main>

<script>
  const vela = document.getElementById('vela');
  vela.addEventListener('click', () => {
    document.body.classList.add('apagada');
    vela.setAttribute('aria-expanded', 'true');
  }, { once: true });
</script>

</body>
</html>
